spring.application.name=rc

# MySQL Database Configuration
# Credentials come from environment variables, nothing secret is stored in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_judge}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Store and read all timestamps as UTC (the Node app returned ISO UTC strings)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server Configuration
server.port=8080

# JWT: same JWT_SECRET value as the Node backend, so existing tokens keep working.
# Must be at least 32 characters long (HS256). No default on purpose: the app will not start without it.
jwt.secret=${JWT_SECRET}

# CORS: same allowed origins as the Node backend (FRONTEND_URL is added when set)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://ctd-rc-frontend-2025.vercel.app,https://ctd-rc.credenz.co.in,${FRONTEND_URL:}
