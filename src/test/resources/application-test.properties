# Used only by the tests (profile "test"): in-memory database, so no MySQL server is needed.
# NON_KEYWORDS=USER lets H2 create a table called "user", which MySQL allows without quoting.
spring.datasource.url=jdbc:h2:mem:ojtest;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Made-up secret that exists only for tests
jwt.secret=test-only-secret-for-unit-tests-0123456789
